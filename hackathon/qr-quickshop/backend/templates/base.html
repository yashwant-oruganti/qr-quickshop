<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}QR QuickShop 🛒{% endblock %}</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f9;
      margin: 0;
      padding: 0;
    }
    h1 {
      text-align: center;
      color: #0077b6;
      margin-top: 20px;
    }

    /* Navbar */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0077b6;
      padding: 12px 20px;
      color: white;
      flex-wrap: nowrap;
      position: sticky;
      top: 0;
      z-index: 1000;
    }
    .navbar .logo {
      font-weight: bold;
      font-size: 1.3em;
      color: white;
      text-decoration: none;
      margin-right: 20px;
    }
    .nav-left {
      display: flex;
      align-items: center;
      gap: 15px;
    }
    .nav-left a {
      color: white;
      text-decoration: none;
      font-weight: 500;
      transition: 0.2s;
    }
    .nav-left a:hover {
      text-decoration: underline;
    }

    /* Search */
    .nav-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .search-form {
      display: flex;
      gap: 5px;
    }
    .search-form input {
      padding: 6px 10px;
      border-radius: 4px;
      border: none;
      outline: none;
      width: 200px;
    }
    .search-form button {
      background: #023e8a;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    .search-form button:hover {
      background: #03045e;
    }

    /* Login/Logout Button */
    .nav-btn {
      background: #fff;
      color: #0077b6 !important;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: bold;
      text-decoration: none;
      transition: 0.3s;
      display: inline-block;
    }
    .nav-btn:hover {
      background: #90e0ef;
      color: #03045e !important;
    }

    /* Page content */
    .container {
      padding: 20px;
    }

    /* Responsive (Burger Menu) */
    .menu-toggle {
      display: none;
      font-size: 24px;
      cursor: pointer;
      color: white;
      background: none;
      border: none;
    }
    @media (max-width: 768px) {
      .navbar {
        flex-wrap: wrap;
      }
      .menu-toggle {
        display: block;
      }
      .nav-left {
        display: none;
        flex-direction: column;
        width: 100%;
        background: #0077b6;
        margin-top: 10px;
        padding: 10px 0;
      }
      .nav-left.show {
        display: flex;
      }
      .nav-right {
        width: 100%;
        justify-content: space-between;
        margin-top: 10px;
      }
      .search-form {
        flex: 1;
      }
      .search-form input {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <a href="{{ url_for('home') }}" class="logo">QR QuickShop</a>
    <button class="menu-toggle" onclick="toggleMenu()">☰</button>

    <div class="nav-left" id="nav-left">
      <a href="{{ url_for('home') }}">Home</a>
      <a href="{{ url_for('favourites_page') }}">Favourites</a>
      <a href="{{ url_for('home') }}#cartBox">Cart</a>
      <a href="{{ url_for('dashboard') }}">Worker Dashboard</a>
    </div>

    <div class="nav-right">
      <!-- ✅ Search Form (now connected to SQLite via server.py) -->
      <form action="{{ url_for('search') }}" method="get" class="search-form">
        <input type="text" name="q" placeholder="Search products..." required>
        <button type="submit">Search</button>
      </form>

      {% if session.get('user') %}
        <a href="{{ url_for('logout') }}" class="nav-btn">Logout</a>
      {% else %}
        <a href="{{ url_for('login_page') }}" class="nav-btn">Login</a>
      {% endif %}
    </div>
  </nav>

  <!-- Page Content -->
  <div class="container">
    {% block content %}{% endblock %}
  </div>

  <script>
    function toggleMenu() {
      document.getElementById("nav-left").classList.toggle("show");
    }
  </script>

</body>
</html>
