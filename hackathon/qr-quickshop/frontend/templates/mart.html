<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.7/minified/html5-qrcode.min.js"></script>
  <title>Mart Dashboard — QR QuickShop</title>
</head>
<body data-page="mart" class="bg-gray-50">
  <nav class="bg-white shadow p-4">
    <div class="max-w-5xl mx-auto flex justify-between items-center">
      <div class="text-xl font-bold">🛒 QR QuickShop - Mart</div>
      <div>
        <a href="/" class="px-3 py-1 rounded hover:bg-gray-100">Home</a>
      </div>
    </div>
  </nav>

  <main class="max-w-5xl mx-auto p-6">
    <h1 class="text-2xl font-semibold mb-4">Mart Dashboard</h1>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div class="bg-white p-4 rounded shadow">
        <h3 class="font-semibold mb-2">Scanner</h3>
        <div id="reader" style="width:100%"></div>
        <div id="lastToken" class="mt-2 text-sm text-gray-600"></div>
      </div>

      <div class="bg-white p-4 rounded shadow">
        <h3 class="font-semibold mb-2">Order</h3>
        <div id="orderArea">Scan a customer's QR to load order.</div>
      </div>
    </div>
  </main>

  <script src="/static/js/script.js"></script>
</body>
</html>
