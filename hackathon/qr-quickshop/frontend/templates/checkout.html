<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <script src="https://cdn.tailwindcss.com"></script>
  <title>Checkout — QR QuickShop</title>
</head>
<body data-page="checkout" class="bg-gray-50">
  <nav class="bg-white shadow p-4">
    <div class="max-w-5xl mx-auto flex justify-between items-center">
      <div class="text-xl font-bold">🛒 QR QuickShop</div>
      <div class="space-x-3">
        <a href="/" class="px-3 py-1 rounded hover:bg-gray-100">Home</a>
        <a href="/cart" class="px-3 py-1 rounded hover:bg-gray-100">Cart</a>
      </div>
    </div>
  </nav>

  <main class="max-w-4xl mx-auto p-6">
    <h1 class="text-2xl font-semibold mb-4">Checkout</h1>

    <div id="checkoutArea" class="bg-white p-6 rounded shadow">
      <div id="itemsList"></div>

      <div class="mt-4">
        <label class="inline-flex items-center mr-4">
          <input type="radio" name="method" value="DELIVERY" checked /> <span class="ml-2">Delivery (mock)</span>
        </label>
        <label class="inline-flex items-center">
          <input type="radio" name="method" value="PICKUP" /> <span class="ml-2">QR Pickup (pay at counter)</span>
        </label>
      </div>

      <div id="pickupOptions" class="mt-4 hidden">
        <div>
          <label class="font-semibold">Choose Mart</label>
          <select id="martSelect" class="mt-2 p-2 border rounded w-full"></select>
        </div>

        <div id="availability" class="mt-4"></div>
      </div>

      <div class="mt-6 flex justify-between items-center">
        <div id="total" class="font-bold text-lg">Total: ₹0</div>
        <button id="placeBtn" class="px-4 py-2 rounded bg-indigo-600 text-white">Place Order</button>
      </div>

      <div id="qrBox" class="mt-6"></div>
    </div>
  </main>

  <script src="/static/js/script.js"></script>
</body>
</html>
